name: Deploy Automatico em Tempo Real - GitHub Pages (EMEB Joaquim Candelario de Freitas)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GH_PAGES_TOKEN || github.token }}

      - name: Diagnóstico de Permissão do GitHub Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::O GitHub Pages ainda não está ativado neste repositório (ou o repositório está privado no plano Free). O token padrão GITHUB_TOKEN não tem permissão para criar o site Pages pela primeira vez."
          echo "Solução (1 clique): Acesse Settings > Pages > Build and deployment > Source e selecione 'GitHub Actions'. Se o repositório estiver privado no plano Free, altere para Público (ou adicione um PAT com Administration:write em Settings > Secrets > GH_PAGES_TOKEN)."
          exit 1

      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar Dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 5. Compilar Aplicativo (Vite Build)
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - name: 6. Garantir Fallback SPA (404.html) e Remover CNAME antigo
        run: |
          cp dist/index.html dist/404.html
          rm -f dist/CNAME public/CNAME

      - name: 7. Enviar Artefato da Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 8. Publicar em Tempo Real no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
